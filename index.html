<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המתכונים שלי</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f5d4a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header>
    <h1><a href="index.html"><img src="icon-192.png" alt=""> המתכונים שלי</a></h1>
  </header>
  <main>
    <input
      type="search"
      id="search"
      class="search-box"
      placeholder="חיפוש מתכונים..."
      dir="auto"
      autocomplete="off"
    >
    <div class="tag-filters" id="tag-filters"></div>
    <div id="recipe-list"></div>
    <p class="empty-state" id="empty-state" style="display:none;">לא נמצאו מתכונים תואמים לחיפוש.</p>
  </main>

  <script src="recipes-data.js"></script>
  <script src="tag-colors.js"></script>
  <script src="app.js"></script>
</body>
</html>
