<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RECIPE NAME | My Recipes</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3f5d4a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1><a href="../index.html"><img src="../icon-192.png" alt=""> My Recipes</a></h1>
  </header>
  <main>
    <a class="back-link" href="../index.html">&larr; All recipes</a>
    <h1 dir="auto">RECIPE NAME</h1>
    <div class="recipe-meta" dir="auto">
      <span>⏱ TIME</span>
      <span>🍽 SERVINGS</span>
      <div class="recipe-tags">
        <span class="recipe-tag" data-tag="TAG1">TAG1</span>
        <span class="recipe-tag" data-tag="TAG2">TAG2</span>
      </div>
    </div>

    <h2>Ingredients</h2>
    <ul class="ingredients" dir="auto">
      <li>Ingredient 1</li>
      <li>Ingredient 2</li>
    </ul>

    <h2>Steps</h2>
    <ol class="steps" dir="auto">
      <li>Step 1</li>
      <li>Step 2</li>
    </ol>

    <h2>Notes</h2>
    <ul dir="auto">
      <li>Optional notes</li>
    </ul>
  </main>

  <script src="../tag-colors.js"></script>
  <script>
    document.querySelectorAll(".recipe-tag").forEach(el => {
      el.classList.add(tagColorClass(el.dataset.tag));
    });
  </script>
</body>
</html>
